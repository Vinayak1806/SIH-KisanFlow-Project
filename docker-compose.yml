version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kisanflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kisanflow
      POSTGRES_PASSWORD: kisanflow123
      POSTGRES_DB: kisanflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisanflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kisanflow_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: kisanflow_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://kisanflow:kisanflow123@postgres:5432/kisanflow
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=kisanflow-sih2026-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: kisanflow_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:
